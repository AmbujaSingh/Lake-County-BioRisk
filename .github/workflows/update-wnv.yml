# Save this file as: .github/workflows/update-wnv.yml in your repo root.
#
# Runs the IDPH scraper on a schedule, and commits data/wnv-current.json
# back to the repo whenever the numbers change. Your GitHub Pages site
# then just fetches that JSON file directly -- no API keys, no CORS issues.

name: Update WNV Data

on:
  schedule:
    # Runs at 13:00 UTC daily (~8am Central). WNV season runs roughly
    # May-October, but running year-round is harmless -- the script just
    # writes whatever the current year's page shows.
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scraper
        run: python scrape_wnv.py

      - name: Commit updated data if changed
        run: |
          git config user.name "wnv-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/wnv-current.json
          git diff --staged --quiet || git commit -m "Update WNV data $(date -u +%Y-%m-%d)"
          git push
